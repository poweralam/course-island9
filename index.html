<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數位科技概論課程島｜認識網際網路</title>
<style>
:root{--ink:#4a4560;--ink2:#6f6a88;--card:rgba(255,255,255,.92);--accent:#8e7cc3;--accent2:#f4a6c0;--ok:#3f8f6d;--bad:#b5566f;--line:#e4def2;--soft:#f6f2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#cfe3ff 0%,#e6dcff 55%,#ffe6ee 100%)}
body.low{background:linear-gradient(180deg,#e9ecf2 0%,#eeebf3 100%)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8e7cc3;outline-offset:2px}
#top{position:fixed;left:12px;right:12px;top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.title{background:var(--card);border-radius:18px;padding:8px 16px;box-shadow:0 4px 16px rgba(120,100,170,.15)}
.title h1{margin:0;font-size:clamp(16px,2.4vw,22px);letter-spacing:.04em}
.title .sub{font-size:13px;color:var(--ink2)}
.title .by{display:inline-block;margin-left:6px;font-size:12px;background:var(--soft);padding:1px 10px;border-radius:99px;color:var(--accent)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:var(--card);border:2px solid transparent;border-radius:99px;padding:7px 14px;font-size:14px;box-shadow:0 3px 10px rgba(120,100,170,.14);transition:transform .2s,border-color .2s}
.pill:hover{border-color:var(--accent2)}
.pill[aria-pressed="true"]{background:#e8f6ee;border-color:#8cc9a9}
.vol{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.vol input{width:80px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.island-label{position:absolute;left:0;top:0;pointer-events:auto;background:var(--card);border:2px solid #fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;box-shadow:0 3px 10px rgba(120,100,170,.2)}
.island-label.active{border-color:var(--accent);background:#fff}
.island-label.done::after{content:" ⭐"}
#nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);align-items:center}
#nav .pill{padding:6px 12px;font-size:13px}
#nav .pill.active{border-color:var(--accent);background:#fff}
#nav .pill.done::after{content:" ⭐"}
#prog{background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
#hint{position:fixed;left:14px;bottom:58px;z-index:4;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.7);padding:4px 10px;border-radius:99px}
#panel{position:fixed;z-index:6;right:14px;top:122px;bottom:62px;width:min(430px,calc(100vw - 28px));background:var(--card);border-radius:24px;box-shadow:0 10px 36px rgba(100,80,160,.22);padding:18px 20px 20px;overflow:auto;transform:translateX(calc(100% + 30px));transition:transform .35s ease;line-height:1.7;font-size:15px}
#panel.open{transform:none}
body.low #panel{transition:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.low *{transition:none!important;animation:none!important}
#panel .close{position:absolute;right:12px;top:10px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:16px}
.tag{display:inline-block;background:var(--soft);color:var(--accent);padding:1px 10px;border-radius:99px;font-size:12px}
#panel h2{margin:6px 0 0;font-size:22px}
#panel h3{margin:16px 0 6px;font-size:16px;color:var(--accent)}
#panel .sub{margin:0;color:var(--ink2);font-size:13px}
#panel ul{margin:4px 0;padding-left:20px}
#panel li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left}
th{background:var(--soft)}
.note{font-size:12.5px;color:var(--ink2);background:#fbf8ff;border-left:4px solid var(--accent2);padding:6px 10px;border-radius:8px;margin:8px 0}
.act{background:#fbf9ff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px}
.act h3{margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.row .nm{min-width:110px;font-weight:600}
.chip,.tab,.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;font-size:14px}
.chip:hover,.tab:hover,.opt:hover{border-color:var(--accent2)}
.chip.ok,.opt.ok,.tab.on,.chip.on{border-color:#7fc3a0;background:#e8f6ee}
.chip.no,.opt.no{border-color:#e0a1b5;background:#fdeef3}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.fb,.ex{font-size:13px;color:var(--ink2)}
.q{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.q:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.detail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.bar{height:12px;border-radius:99px;background:#eee9f8;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a7c8ff,#f4a6c0);border-radius:99px}
input[type=text],select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:4px 8px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;margin:6px 0 2px;color:var(--ink2)}
.out{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px;font-size:14px;word-break:break-all}
.seg{display:inline-block;padding:0 6px;border-radius:8px;margin:1px;font-weight:600}
.s1{background:#ffd9e4}.s2{background:#d7e8ff}.s3{background:#fff1b8}.s4{background:#dff3e4}.s5{background:#e6dcff}
.pnav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:9;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 8px 24px rgba(100,80,160,.25);display:none}
#fallback{display:none;position:fixed;left:14px;top:140px;z-index:4;background:#fff7e6;border-radius:14px;padding:10px 14px;max-width:340px;font-size:13px}
body.no3d #fallback{display:block}
@media (max-width:820px){
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:100px;max-height:50vh;transform:translateY(calc(100% + 120px))}
  #panel.open{transform:none}
  #hint{display:none}
  .island-label{font-size:12px;padding:3px 8px}
}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(232,226,248,.88)}
body.low .overlay{background:rgba(238,235,243,.97)}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 36px rgba(100,80,160,.22);padding:20px 24px;width:min(430px,100%);max-height:100%;overflow:auto}
.card h2{margin:0 0 4px;font-size:21px}
.card p{margin:6px 0;font-size:14px;color:var(--ink2)}
.card input[type=text],.card input[type=password]{font-size:18px;padding:8px 12px;margin:6px 0 4px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:2px solid #6f5bb0;background:#6f5bb0;color:#fff;border-radius:99px;padding:8px 18px;font-size:15px}
.btn.ghost{background:#fff;color:#5a479a}
.err{color:var(--bad);font-size:13px;min-height:1.4em}
#syncchip{font-size:13px;background:var(--card);border-radius:99px;padding:7px 12px;box-shadow:0 3px 10px rgba(120,100,170,.14)}
#teacher .card{width:min(1000px,100%);height:min(88vh,740px);display:flex;flex-direction:column}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw{overflow:auto;flex:1;margin-top:8px;border:1px solid var(--line);border-radius:12px}
.tw table{margin:0;font-size:14px}
.tw th{position:sticky;top:0;z-index:1;white-space:nowrap}
.tw td{white-space:nowrap}
td.c0{background:#f1eff6;color:#7d7894}td.c1{background:#fff3c9}td.c2{background:#dcf2e6}
td.num{text-align:center;font-variant-numeric:tabular-nums}
#tSum{margin-top:6px;font-size:14px}
</style>
</head>
<body>

<div id="top">
  <div class="title">
    <h1>🏝️ 數位科技概論課程島<span class="by">by <span id="author">權鈺</span></span></h1>
    <div class="sub">第 9 章・認識網際網路</div>

  <div class="ctrls">
    <button class="pill" id="btnMusic" aria-pressed="false">🎵 背景音樂：關</button>
    <label class="vol" style="margin:0" title="音量">🔈<input type="range" id="vol" min="0" max="100" value="40" aria-label="音量"></label>

<script>
/* ============ 可自行修改 ============ */
const AUTHOR = '權鈺';
// 課堂同步：貼上 Google Apps Script「網頁應用程式」網址（結尾是 /exec）。留空＝進度只存在學生自己的電腦。
const SYNC_URL = 'https://script.google.com/a/macros/hshs.chc.edu.tw/s/AKfycbxMan7iNv9fJleds5stMxo8FZYQochbVEKIvS4MK44vuBA9EeFQ8RV3KjYIAQWxgrcxxA/exec';
/* ==================================== */
document.getElementById('author').textContent = AUTHOR;

/* ---------- 狀態 ---------- */
let low = false;
try{ const s=localStorage.getItem('island_low'); if(s!==null) low = s==='1'; else if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) low=true; }catch(e){}
let current = -1;
const done = [new Set(),new Set(),new Set(),new Set(),new Set()];
const $ = s=>document.querySelector(s);
const isMobile = ()=>innerWidth<=820;

/* ---------- 課程資料 ---------- */
const ISLANDS = [
{ id:'A', emoji:'📡', name:'連網服務島', sub:'ISP・ICP・NSP', widget:widgetA,
  body:`<h3>📘 重點</h3><ul>
  <li><b>ISP</b>（網際網路服務提供者）：提供連接網際網路服務的電信業者或政府單位。</li>
  <li>ISP 通常還提供入口網站、電子郵件帳號、網頁存放空間等附加服務。</li>
  <li><b>ICP</b>（網際網路內容提供者）：提供各類資訊的網站經營業者，如 Yahoo!奇摩、聯合新聞網、PChome、104 人力銀行。</li>
  <li><b>NSP</b>（網路服務提供者）：提供 ISP 業者租用骨幹網路，如中華電信、AT&amp;T。中華電信既是 NSP 也是 ISP。</li></ul>
  <table><tr><th>ISP</th><th>成立單位</th><th>收費</th><th>對象</th></tr>
  <tr><td>TANet</td><td>教育部</td><td>免費</td><td>各級學校、研究單位</td></tr>
  <tr><td>HiNet</td><td>中華電信</td><td rowspan="4">收費</td><td rowspan="4">公司行號、一般大眾</td></tr>
  <tr><td>TWM</td><td>台灣固網</td></tr><tr><td>Seednet</td><td>數位聯合電信</td></tr><tr><td>So-net</td><td>索尼（Sony）</td></tr></table>
  <div class="note">註：數位聯合電信公司已於 2009 年被新世紀資通併購。</div>`,
  quiz:[
   {q:'Yahoo!奇摩通常扮演什麼角色？',o:['ISP','ICP','NSP','DNS'],a:1,ex:'提供各類資訊的網站經營業者是網際網路內容提供者（ICP）。'},
   {q:'由教育部成立、免費提供學校與研究單位連網的是？',o:['HiNet','Seednet','TANet','So-net'],a:2,ex:'TANet（臺灣學術網路）由教育部成立，免費。'},
   {q:'下列何者「不可能」是 ISP 提供的服務？',o:['提供連網服務','提供網頁存放空間','提供電子郵件帳號','提供國安局機密資料全文免費查詢'],a:3,ex:'ISP 提供連網、網頁空間、電子郵件等，不會提供機密資料。'},
   {q:'中華電信同時扮演哪兩種角色？',o:['NSP 與 ISP','ICP 與 DNS','ISP 與 ICP','NSP 與 ICP'],a:0,ex:'中華電信出租骨幹網路（NSP），也直接服務用戶上網（ISP）。'}]},
{ id:'B', emoji:'🛰️', name:'連線方式島', sub:'有線與無線上網', widget:widgetB,
  body:`<h3>📘 重點</h3><ul>
  <li><b>電話線撥接</b>：上網時電話線會被占用，速度最慢。</li>
  <li><b>ADSL</b>：語音與網路訊號分離，上網同時也能講電話；下載速度 &gt; 上傳速度，稱為「非對稱」。</li>
  <li><b>纜線數據機</b>：走有線電視纜線，頻寬由所有用戶共享，人越多越慢。</li>
  <li><b>專線</b>（T1～T4）：固定線路，品質穩定但費用高。</li>
  <li><b>光纖</b>：FTTH（到府）最快 &gt; FTTB（到大樓）&gt; FTTC（到路側）；靠光傳播，不受雷擊等電流影響。</li>
  <li><b>無線</b>：Wi-Fi（IEEE 802.11x）、3G/3.5G、4G LTE、5G NR；需安裝對應網卡。</li>
  <li>行動世代：2G 9.6 Kbps → 2.5G 115.2 Kbps → 3G 2 Mbps → 3.5G 14.4 Mbps → 4G 300 Mbps → 5G 10 Gbps（可實現物聯網）。</li></ul>`,
  quiz:[
   {q:'使用 ADSL 上網時，可以同時撥打電話嗎？',o:['不行，線路被占用','可以，語音與網路訊號分離','只有半夜可以','要另外加裝光纖'],a:1,ex:'ADSL 採語音與網路訊號分離技術。'},
   {q:'「家裡越多人上網，連線越慢」最可能是哪一種方式？',o:['纜線數據機','專線 T1','光纖到府 FTTH','ADSL'],a:0,ex:'纜線數據機的頻寬由所有用戶共享。'},
   {q:'FTTH、FTTB、FTTC 哪一種速度最快？',o:['FTTC','FTTB','FTTH','一樣快'],a:2,ex:'光纖到府（FTTH）離用戶最近，速度最快。'},
   {q:'ADSL 頻寬 8M/640K，上傳速度最高約為？',o:['8M','640K','1M','256K'],a:1,ex:'「下載/上傳」，所以上傳是 640K。'},
   {q:'理論傳輸速度最高、可望實現「物聯網」的行動通訊技術是？',o:['3G','3.5G','4G LTE','5G NR'],a:3,ex:'5G NR 理論速度約 10 Gbps。'}]},
{ id:'C', emoji:'🏠', name:'IP 位址島', sub:'IPv4・IPv6・公私有 IP', widget:widgetC,
  body:`<h3>📘 重點</h3><ul>
  <li>IP 位址像電腦的「門牌號碼」，每個都是唯一的。</li>
  <li><b>IPv4</b>：4 個 0～255 的數字，以「.」隔開，如 140.111.34.147（32 位元）。</li>
  <li><b>IPv6</b>：128 位元，8 組、每組 4 個 16 進位數，以「:」隔開；前面的 0 可省略，連續的 0000 可用「::」代表，且只能出現一次。</li>
  <li><b>固定 IP</b>：電信業者給的專屬位址（架站用）；<b>浮動 IP</b>：由 DHCP Server 分配，每次可能不同。</li>
  <li><b>公有 IP</b>可連上網際網路；<b>私有 IP</b>只供內部網路使用；<b>NAT</b>可讓多台電腦共用一個合法 IP。</li>
  <li>特殊位址：127.0.0.1 測試本機；主機位址為 0＝整個網路；為 255＝廣播。</li></ul>
  <table><tr><th>等級</th><th>第 1 個數值</th><th>用途</th></tr>
  <tr><td>A</td><td>0～127</td><td>政府、國家級研究</td></tr><tr><td>B</td><td>128～191</td><td>大企業、ISP、學術</td></tr>
  <tr><td>C</td><td>192～223</td><td>一般企業</td></tr><tr><td>D</td><td>224～239</td><td>群播（特殊用途）</td></tr><tr><td>E</td><td>240～255</td><td>學術等保留</td></tr></table>
  <table><tr><th>私有 IP 範圍</th></tr><tr><td>10.0.0.0 ～ 10.255.255.255</td></tr><tr><td>172.16.0.0 ～ 172.31.255.255</td></tr><tr><td>192.168.0.0 ～ 192.168.255.255</td></tr></table>
  <div class="note">口訣：A 冷（0）、B 伊愛爸（128）、C 伊就餓（192）。</div>`,
  quiz:[
   {q:'224.0.0.1 屬於哪一個 Class？',o:['Class A','Class B','Class C','Class D'],a:3,ex:'224～239 是 Class D，作群播等特殊用途。'},
   {q:'下列何者「不是」合法的 IPv4 位址？',o:['210.121.8.32','256.16.21.10','121.107.255.33','63.11.35.1'],a:1,ex:'每個數值必須在 0～255 之間，256 超出範圍。'},
   {q:'想測試「本機」TCP/IP 環境是否正常，可 ping 哪個位址？',o:['0.0.0.0','127.0.0.1','192.168.10.1','255.255.255.255'],a:1,ex:'127.0.0.1 是本機測試用位址。'},
   {q:'IPv6 位址長度是多少位元？',o:['32','64','128','256'],a:2,ex:'IPv6 為 128 位元，是 IPv4（32 位元）的 4 倍長。'},

function parseIP(s){const p=s.trim().split('.'); if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255)) return null; return p.map(Number);}
function widgetC(el){
  el.innerHTML=`<label for="ipin">輸入一個 IPv4 位址：</label><input type="text" id="ipin" value="140.112.8.116" inputmode="decimal"><div class="out" id="ipout"></div>
  <label for="v6in" style="margin-top:12px">IPv6 縮寫練習（輸入 8 組完整位址）：</label><input type="text" id="v6in" value="2001:0288:4200:0000:0000:0000:0000:0024"><div class="out" id="v6out"></div>`;
  const out=el.querySelector('#ipout');
  function a1(){
    const p=parseIP(el.querySelector('#ipin').value);
    if(!p){out.innerHTML='❌ 不是合法的 IPv4：需要 4 個 0～255 的數字，以「.」隔開。';return;}
    const f=p[0]; let cls,mask,hostN;
    if(f<=127){cls='A';mask='255.0.0.0';hostN=3}else if(f<=191){cls='B';mask='255.255.0.0';hostN=2}else if(f<=223){cls='C';mask='255.255.255.0';hostN=1}else if(f<=239){cls='D'}else{cls='E'}
    let h=`✅ 合法 IPv4<br>等級：<b>Class ${cls}</b>`;
    if(mask) h+=`（預設遮罩 ${mask}）`; else h+=`（${cls==='D'?'群播':'保留'}，特殊用途）`;
    const priv=f===10||(f===172&&p[1]>=16&&p[1]<=31)||(f===192&&p[1]===168);
    h+=`<br>類型：<b>${priv?'私有（虛擬）IP，無法直接連上網際網路':'公有（合法）IP 範圍'}</b>`;
    if(p.join('.')==='127.0.0.1') h+='<br>🔁 本機測試位址（ping 127.0.0.1 測 TCP/IP 環境）';
    if(hostN){const host=p.slice(4-hostN);
      if(host.every(x=>x===0)) h+='<br>🏷️ 主機位址全為 0：代表「整個網路」';
      if(host.every(x=>x===255)) h+='<br>📢 主機位址全為 255：代表對此網路「廣播」';}
    out.innerHTML=h;
  }
  function a2(){
    const g=el.querySelector('#v6in').value.trim().split(':'), o=el.querySelector('#v6out');
    if(g.length!==8||g.some(x=>!/^[0-9a-fA-F]{1,4}$/.test(x))){o.textContent='需要 8 組、每組 1～4 個 16 進位數字。';return;}
    const s=g.map(x=>x.replace(/^0+(?=.)/,'').toLowerCase());
    let best=-1,bl=0;
    for(let i=0;i<8;){ if(s[i]==='0'){let j=i;while(j<8&&s[j]==='0')j++; if(j-i>bl){bl=j-i;best=i;} i=j;} else i++; }
    let r;
    if(bl>=2){const L=s.slice(0,best).join(':'),R=s.slice(best+bl).join(':'); r=L+'::'+R;} else r=s.join(':');
    o.innerHTML=`省略前導 0、連續 0 以「::」代替（只能用一次）：<br><b>${r}</b>`;
  }
  el.querySelector('#ipin').oninput=a1; el.querySelector('#v6in').oninput=a2; a1(); a2();
}

function renderQuiz(el,i){
  const qs=ISLANDS[i].quiz;
  el.innerHTML=qs.map((q,qi)=>`<div class="q" data-qi="${qi}"><p style="margin:2px 0"><b>Q${qi+1}.</b> ${q.q}</p>${q.o.map((t,oi)=>`<button class="opt" data-oi="${oi}">${'ABCD'[oi]}. ${t}</button>`).join('')}<div class="ex" aria-live="polite"></div></div>`).join('');
  el.querySelectorAll('.q').forEach(box=>{
    const qi=+box.dataset.qi,q=qs[qi],ex=box.querySelector('.ex'),opts=box.querySelectorAll('.opt');
    const mark=()=>{opts[q.a].classList.add('ok');ex.textContent='✔ 答對了！'+q.ex;};
    if(done[i].has(qi)) mark();
    opts.forEach(b=>b.onclick=()=>{
      if(done[i].has(qi)) return;

let ac=null,master=null,musicOn=false,timer=null,pad=[];

function note(){

      master.connect(ac.destination);master.connect(d);d.connect(ac.destination);}
    ac.resume();master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(0,ac.currentTime);master.gain.linearRampToValueAtTime(vol(),ac.currentTime+2);
    pad=[130.81,196].map(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.18;o.connect(g);g.connect(master);o.start();return o;});

/* ---------- 課堂同步（學號＋進度） ---------- */
const visited=new Set(), acted=new Set();
let sid=null, syncState='off', lastSync=0, dirty=false, saveTimer=null, saving=false;
const SID_RE=/^[A-Za-z0-9]{3,12}$/;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};

// 用 <script> 載入 Apps Script 的回應（JSONP），從本機檔案開啟也不會被跨網站限制擋住
function jsonp(params,timeout){
  return new Promise((res,rej)=>{
    const cb='__cb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const s=document.createElement('script'); let t;
    const clean=()=>{clearTimeout(t);window[cb]=()=>{delete window[cb];};s.remove();};
    window[cb]=d=>{clean();res(d);};
    s.onerror=()=>{clean();rej(new Error('連不到網址（請檢查 SYNC_URL 與存取權）'));};
    t=setTimeout(()=>{clean();rej(new Error('逾時'));},timeout||12000);
    s.src=SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+new URLSearchParams(Object.assign({},params,{callback:cb}));
    document.head.appendChild(s);
  });
}
let lastErr='';
function snapshot(){
  return {v:1,cur:current,
    visited:ISLANDS.map((_,i)=>visited.has(i)),
    acted:ISLANDS.map((_,i)=>acted.has(i)),
    quiz:done.map(s=>[...s].sort((a,b)=>a-b))};
}
function applyState(st){
  if(!st||!Array.isArray(st.quiz)) return;
  ISLANDS.forEach((d,i)=>{
    if(st.visited&&st.visited[i]) visited.add(i);
    if(st.acted&&st.acted[i]) acted.add(i);
    (st.quiz[i]||[]).forEach(q=>{if(Number.isInteger(q)&&q>=0&&q<d.quiz.length) done[i].add(q);});
  });
  stars.forEach((s,i)=>{if(s) s.visible=islandDone(i);});
  updateProgress();
}
function markVisited(i){ if(!visited.has(i)) visited.add(i); scheduleSave(); }
function markActed(i){ if(!acted.has(i)){ acted.add(i); scheduleSave(); } }
function setSync(s){
  syncState=s;
  const chip=$('#syncchip'); if(!sid){chip.hidden=true;return;}
  const t={off:'未設定同步',local:'僅存在這台電腦',pending:'同步中…',
    ok:'已同步 '+new Date(lastSync).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}),
    error:'連線不穩，進度先存在這台電腦'+(lastErr?'（'+lastErr+'）':'')}[s];
  chip.textContent='學號 '+sid+'・'+({ok:'☁️ ',pending:'⏳ ',error:'⚠️ ',local:'💾 ',off:'💾 '}[s])+t;
  chip.hidden=false;
}
function scheduleSave(){
  if(!sid) return;
  lsSet('island_prog_'+sid,JSON.stringify(snapshot()));
  dirty=true;
  if(!SYNC_URL){setSync('local');return;}
  if(syncState!=='error') setSync('pending');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!sid||!SYNC_URL||!dirty||saving) return;
  saving=true; dirty=false;
  try{
    const r=await jsonp({action:'save',sid,state:JSON.stringify(snapshot())});
    if(!r||!r.ok) throw new Error((r&&r.error)||'fail');
    lastSync=Date.now(); lastErr=''; setSync('ok');
  }catch(e){
    lastErr=e&&e.message||'未知錯誤'; console.warn('同步失敗：',lastErr);
    dirty=true; setSync('error'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,15000);
  }finally{
    saving=false;
    if(dirty&&syncState!=='error'){clearTimeout(saveTimer);saveTimer=setTimeout(flush,800);}
  }
}
addEventListener('pagehide',()=>{
  if(sid&&SYNC_URL&&dirty&&navigator.sendBeacon){
    try{navigator.sendBeacon(SYNC_URL,new Blob([JSON.stringify({action:'save',sid,state:snapshot()})],{type:'text/plain;charset=utf-8'}));}catch(e){}
  }
});
async function login(id){
  sid=id; lsSet('island_last_sid',id); $('#login').hidden=true;
  const loc=lsGet('island_prog_'+id);
  if(loc){try{applyState(JSON.parse(loc));}catch(e){}}
  $('#btnSwitch').hidden=false;
  setSync(SYNC_URL?'pending':'local');
  if(SYNC_URL){
    try{
      const r=await jsonp({action:'get',sid:id});
      if(r&&r.ok&&r.state) applyState(r.state);
    }catch(e){}
  }
  toast('歡迎，'+id+'！進度會自動儲存');
  syncState='pending'; scheduleSave();   // 登入就先回報一次，老師馬上看得到
}
function initSync(){
  $('#lgNote').textContent=SYNC_URL?'':'（老師尚未設定同步網址，進度只會存在這台電腦。）';
  $('#sidin').value=lsGet('island_last_sid')||'';
  $('#lgForm').onsubmit=ev=>{
    ev.preventDefault();
    const v=$('#sidin').value.trim().toUpperCase();
    if(!SID_RE.test(v)){$('#lgErr').textContent='學號要是 3～12 位的英文或數字，請再檢查一次。';return;}
    $('#lgErr').textContent=''; login(v);
  };
  $('#lgSkip').onclick=()=>{$('#login').hidden=true;};
  $('#btnSwitch').onclick=async()=>{await flush();location.reload();};
  $('#btnTeacher').onclick=openTeacher;
  setTimeout(()=>{try{$('#sidin').focus();}catch(e){}},0);
}

/* ---------- 教師頁 ---------- */
let tKey='', tTimer=null, tRows=[];
const maxScore=i=>2+ISLANDS[i].quiz.length;
function scoreOf(st,i){
  if(!st) return 0;
  return (st.visited&&st.visited[i]?1:0)+(st.acted&&st.acted[i]?1:0)+((st.quiz&&st.quiz[i])||[]).length;
}
function starsOf(st){return ISLANDS.filter((_,i)=>st&&st.quiz&&(st.quiz[i]||[]).length===ISLANDS[i].quiz.length).length;}
function ago(ts){
  if(!ts) return '—';
  const m=Math.floor((Date.now()-ts)/60000);
  return m<1?'剛剛':m<60?m+' 分鐘前':Math.floor(m/60)+' 小時前';
}
function closeTeacher(){clearInterval(tTimer);tTimer=null;$('#teacher').hidden=true;}
function openTeacher(){
  const o=$('#teacher'); o.hidden=false;
  o.innerHTML=`<div class="card"><div class="thead"><h2>👩‍🏫 全班進度</h2><button class="btn ghost" id="tClose">關閉</button></div>`+
  (SYNC_URL?`<div class="row2" style="margin:6px 0 0"><label for="tkey" style="margin:0">教師密碼</label><input type="password" id="tkey" style="width:170px;margin:0" autocomplete="off"><button class="btn" id="tLoad">載入</button><label style="margin:0;display:flex;gap:4px;align-items:center"><input type="checkbox" id="tAuto">每 15 秒自動更新</label><button class="btn ghost" id="tCsv">匯出 CSV</button></div>`
   :`<p>尚未設定同步網址。請在 HTML 檔最上方的 <b>SYNC_URL</b> 貼上 Apps Script 網址後，再開啟這個頁面。</p>`)+
  `<div class="err" id="tErr" role="alert"></div><div id="tSum"></div><div class="tw" id="tTable"></div></div>`;
  $('#tClose').onclick=closeTeacher;
  if(!SYNC_URL) return;
  $('#tkey').value=tKey;
  $('#tLoad').onclick=()=>{tKey=$('#tkey').value;loadTeacher();};
  $('#tkey').onkeydown=e=>{if(e.key==='Enter'){tKey=$('#tkey').value;loadTeacher();}};
  $('#tAuto').onchange=e=>{clearInterval(tTimer);tTimer=e.target.checked?setInterval(loadTeacher,15000):null;};
  $('#tCsv').onclick=exportCsv;
  if(tKey) loadTeacher(); else $('#tkey').focus();
  renderTeacher();
}
async function loadTeacher(){
  const err=$('#tErr'); if(!err) return;
  try{
    const r=await jsonp({action:'list',key:tKey});
    if(!r||!r.ok){err.textContent=r&&r.error==='unauthorized'?'教師密碼不正確。':'讀取失敗：'+((r&&r.error)||'未知錯誤');return;}
    err.textContent=''; tRows=r.rows||[]; renderTeacher();
  }catch(e){err.textContent='連不上同步服務：'+(e&&e.message||'')+'。請稍後再按「載入」。';}
}
function renderTeacher(){
  const box=$('#tTable'); if(!box) return;
  const rows=tRows.slice().sort((a,b)=>String(a.sid).localeCompare(String(b.sid)));
  const full=rows.filter(r=>starsOf(r.state)===5).length;
  const live=rows.filter(r=>Date.now()-r.ts<5*60000).length;
  $('#tSum').textContent=rows.length?`共 ${rows.length} 位學生・5 座島全完成 ${full} 位・5 分鐘內有操作 ${live} 位`:'還沒有學生資料。學生輸入學號後會立刻出現在這裡。';
  const tbl=document.createElement('table');
  const hr=tbl.insertRow();
  ['學號',...ISLANDS.map(d=>d.id+' '+d.emoji),'完成島數','目前所在','最後更新'].forEach(t=>{const th=document.createElement('th');th.textContent=t;hr.appendChild(th);});
  rows.forEach(r=>{
    const tr=tbl.insertRow(); const st=r.state;
    tr.insertCell().textContent=r.sid;
    ISLANDS.forEach((d,i)=>{
      const s=scoreOf(st,i),m=maxScore(i),td=tr.insertCell();
      td.className='num '+(s===0?'c0':s>=m?'c2':'c1'); td.textContent=s+'/'+m;
      td.title='到訪 '+(st&&st.visited&&st.visited[i]?'✓':'—')+'　活動 '+(st&&st.acted&&st.acted[i]?'✓':'—')+'　測驗 '+(((st&&st.quiz&&st.quiz[i])||[]).length)+'/'+d.quiz.length;
    });
    tr.insertCell().textContent=starsOf(st)+' / 5';
    tr.insertCell().textContent=st&&st.cur>=0?ISLANDS[st.cur].id:'—';
    tr.insertCell().textContent=ago(r.ts);
  });
  box.replaceChildren(tbl);
}
function exportCsv(){
  const rows=tRows.slice().sort((a,b)=>String(a.sid).localeCompare(String(b.sid)));
  const lines=[['學號',...ISLANDS.map(d=>d.id+'島分數(滿分'+maxScore(ISLANDS.indexOf(d))+')'),'完成島數','最後更新'].join(',')];
  rows.forEach(r=>lines.push(['"'+String(r.sid).replace(/"/g,'""')+'"',...ISLANDS.map((_,i)=>scoreOf(r.state,i)),starsOf(r.state),r.ts?new Date(r.ts).toLocaleString('zh-TW',{hour12:false}):''].join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='課程島進度.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 啟動 ---------- */
document.body.classList.toggle('low',low);
$('#btnLow').setAttribute('aria-pressed',low);$('#btnLow').textContent='🌿 低刺激模式：'+(low?'開':'關');
init3D();
renderWelcome();
initSync();
</script>
</body>
